server:
  forward-headers-strategy: framework

spring:
  application:
    name: MoleLaw_backend
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
    default: mysql
    group:
      local:
        - mysql
        - qdrant

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4}
          temperature: 0.5
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 1s


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    csrf:
      enabled: false
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

logging:
  level:
    org.springframework.security: INFO


openlaw:
  api-key: ${OC_KEY}

frontend:
  uri: ${FRONTENDURI}

security:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${frontend.uri}}

cookie:
  csrf-http-only: true
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

jwt:
  secret: ${JWT_SECRET}
  # Production/default lifetime. Local development overrides this for convenience.
  access-ttl: 5m

app:
  chat:
    encryption:
      key: ${CHAT_ENCRYPTION_KEY:}
      key-version: ${CHAT_ENCRYPTION_KEY_VERSION:v1}
  law-vector:
    enabled: ${APP_LAW_VECTOR_ENABLED:false}
    embedding-base-url: ${APP_LAW_VECTOR_EMBEDDING_BASE_URL:http://localhost:11436}
    qdrant-base-url: ${APP_LAW_VECTOR_QDRANT_BASE_URL:http://localhost:6333}
    collection-name: ${APP_LAW_VECTOR_COLLECTION_NAME:molelaw_service_law_kure_v1}
    api-key: ${QDRANT_API_KEY:}
