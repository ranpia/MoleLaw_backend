server:
  forward-headers-strategy: framework

spring:
  application:
    name: MoleLaw_backend
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}
    default: mysql
    group:
      local:
        - mysql
        - qdrant

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5.4-mini}
          reasoning-effort: ${OPENAI_CHAT_REASONING_EFFORT:none}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:1536}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        max-interval: 1s


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope:
              - email
              - profile

        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: email

springdoc:
  override-with-generic-response: false
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    csrf:
      enabled: false
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

logging:
  level:
    org.springframework.security: INFO


openlaw:
  api-key: ${OC_KEY}

frontend:
  uri: ${FRONTENDURI}

security:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${frontend.uri}}

cookie:
  csrf-http-only: true
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

jwt:
  secret: ${JWT_SECRET}
  # Production/default lifetime. Local development overrides this for convenience.
  access-ttl: 5m

app:
  case-search:
    max-api-calls: ${APP_CASE_SEARCH_MAX_API_CALLS:64}
    max-candidates: ${APP_CASE_SEARCH_MAX_CANDIDATES:5000}
    max-details: ${APP_CASE_SEARCH_MAX_DETAILS:6}
    details-per-search: ${APP_CASE_SEARCH_DETAILS_PER_SEARCH:4}
    max-selected: ${APP_CASE_SEARCH_MAX_SELECTED:2}
    minimum-score: ${APP_CASE_SEARCH_MINIMUM_SCORE:60}
    excerpt-chars: ${APP_CASE_SEARCH_EXCERPT_CHARS:4000}
    max-rerank-calls: ${APP_CASE_SEARCH_MAX_RERANK_CALLS:2}
  chat-stream:
    max-concurrent: ${APP_CHAT_STREAM_MAX_CONCURRENT:4}
    write-threads: ${APP_CHAT_STREAM_WRITE_THREADS:4}
    timeout: ${APP_CHAT_STREAM_TIMEOUT:20m}
  law-reranker:
    enabled: ${APP_LAW_RERANKER_ENABLED:false}
    base-url: ${APP_LAW_RERANKER_BASE_URL:http://localhost:11437}
    model: ${APP_LAW_RERANKER_MODEL:BAAI/bge-reranker-v2-m3}
    revision: ${APP_LAW_RERANKER_REVISION:953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e}
    candidate-limit: ${APP_LAW_RERANKER_CANDIDATE_LIMIT:50}
    read-timeout-millis: ${APP_LAW_RERANKER_READ_TIMEOUT_MILLIS:30000}
  law-candidate-selection:
    minimum-score: ${APP_LAW_CANDIDATE_MINIMUM_SCORE:70}
    max-candidates: ${APP_LAW_CANDIDATE_MAX_CANDIDATES:2}
  law-retrieval:
    backend: ${APP_LAW_RETRIEVAL_BACKEND:QDRANT}
  law-ai-search:
    base-url: ${APP_LAW_AI_SEARCH_BASE_URL:https://www.law.go.kr/DRF}
  ai:
    case-rerank:
      model: ${APP_AI_CASE_RERANK_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_CASE_RERANK_REASONING_EFFORT:low}
      max-completion-tokens: ${APP_AI_CASE_RERANK_MAX_COMPLETION_TOKENS:4096}
    case-query:
      model: ${APP_AI_CASE_QUERY_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_CASE_QUERY_REASONING_EFFORT:low}
      max-completion-tokens: ${APP_AI_CASE_QUERY_MAX_COMPLETION_TOKENS:2048}
    read-timeout-ms: ${APP_AI_READ_TIMEOUT_MS:120000}
    read:
      model: ${APP_AI_READ_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_READ_REASONING_EFFORT:low}
      max-completion-tokens: ${APP_AI_READ_MAX_COMPLETION_TOKENS:4096}
    question:
      model: ${APP_AI_QUESTION_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_QUESTION_REASONING_EFFORT:low}
      max-completion-tokens: ${APP_AI_QUESTION_MAX_COMPLETION_TOKENS:4096}
    candidate:
      model: ${APP_AI_CANDIDATE_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_CANDIDATE_REASONING_EFFORT:low}
      max-completion-tokens: ${APP_AI_CANDIDATE_MAX_COMPLETION_TOKENS:8192}
    evidence:
      catalog-max-input-tokens: ${APP_AI_EVIDENCE_CATALOG_MAX_INPUT_TOKENS:4000}
      body-max-input-tokens: ${APP_AI_EVIDENCE_BODY_MAX_INPUT_TOKENS:12000}
      decision-max-input-tokens: ${APP_AI_EVIDENCE_DECISION_MAX_INPUT_TOKENS:20000}
      model: ${APP_AI_EVIDENCE_MODEL:gpt-5.4}
      reasoning-effort: ${APP_AI_EVIDENCE_REASONING_EFFORT:medium}
      max-completion-tokens: ${APP_AI_EVIDENCE_MAX_COMPLETION_TOKENS:12288}
      max-input-tokens: ${APP_AI_EVIDENCE_MAX_INPUT_TOKENS:2500}
    answer:
      model: ${APP_AI_ANSWER_MODEL:gpt-5.4-mini}
      reasoning-effort: ${APP_AI_ANSWER_REASONING_EFFORT:medium}
      max-completion-tokens: ${APP_AI_ANSWER_MAX_COMPLETION_TOKENS:16384}
  chat:
    encryption:
      key: ${CHAT_ENCRYPTION_KEY:}
      key-version: ${CHAT_ENCRYPTION_KEY_VERSION:v1}
  law-vector:
    gpu-count: ${APP_LAW_VECTOR_GPU_COUNT:0}
    threads: ${APP_LAW_VECTOR_THREADS:6}
    embedding-max-calls: ${APP_LAW_VECTOR_EMBEDDING_MAX_CALLS:1024}
    indexing-max-calls: ${APP_LAW_VECTOR_INDEXING_MAX_CALLS:1024}
    embedding-timeout-seconds: ${APP_LAW_VECTOR_EMBEDDING_TIMEOUT_SECONDS:900}
    embedding-read-timeout-millis: ${APP_LAW_VECTOR_EMBEDDING_READ_TIMEOUT_MILLIS:120000}
    enabled: ${APP_LAW_VECTOR_ENABLED:false}
    embedding-base-url: ${APP_LAW_VECTOR_EMBEDDING_BASE_URL:http://localhost:11436}
    qdrant-base-url: ${APP_LAW_VECTOR_QDRANT_BASE_URL:http://localhost:6333}
    collection-name: ${APP_LAW_VECTOR_COLLECTION_NAME:molelaw_service_law_kure_v1}
    api-key: ${QDRANT_API_KEY:}
