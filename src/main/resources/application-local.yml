spring:
  config:
    activate:
      on-profile: local & !test

server:
  ssl:
    enabled: false

# Local diagnosis only: validated decision reason/issues and visible source titles, never source bodies.
logging:
  level:
    com.MoleLaw_backend.law.service.retrieval.EvidenceDecisionPlanner: DEBUG

jwt:
  # Keep Access lifetime aligned with production; never activate local in production.
  access-ttl: 5m

frontend:
  uri: ${FRONTENDURI:http://localhost:3000}
security:
  # Development frontend and the local Swagger UI. Production uses its own allowlist.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${frontend.uri},http://localhost:8080}
cookie:
  csrf-http-only: false
  secure: false
  same-site: Lax

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    csrf:
      enabled: true
