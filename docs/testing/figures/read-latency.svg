<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc"><title id="title">1차 테스트 · 조회 API: 부하별 p95 지연</title><desc id="desc">1,024 VU 지속 p95 1.5~1.7초는 범위값이므로 막대에서 제외. 64/256/512는 약 180초, 1,024/2,048 탐색은 약 45초. 측정 길이가 다르다.</desc><style>text{font-family:'Malgun Gothic','Noto Sans KR',sans-serif;fill:#172033} .muted{fill:#526176;font-size:13px}</style><rect width="100%" height="100%" rx="14" fill="#f8fafc"/><text x="28" y="37" font-size="23" font-weight="700">1차 테스트 · 조회 API: 부하별 p95 지연</text><text x="28" y="65" class="muted">1,024 VU 지속 p95 1.5~1.7초는 범위값이므로 막대에서 제외</text><rect x="28" y="88" width="12" height="12" rx="3" fill="#2563eb"/><text x="47" y="99" class="muted">응답 p95</text><line x1="275" y1="131" x2="275" y2="377" stroke="#dbe3ed"/><text x="275" y="120" text-anchor="middle" class="muted">0</text><line x1="451.25" y1="131" x2="451.25" y2="377" stroke="#dbe3ed"/><text x="451.25" y="120" text-anchor="middle" class="muted">1350</text><line x1="627.5" y1="131" x2="627.5" y2="377" stroke="#dbe3ed"/><text x="627.5" y="120" text-anchor="middle" class="muted">2700</text><line x1="803.75" y1="131" x2="803.75" y2="377" stroke="#dbe3ed"/><text x="803.75" y="120" text-anchor="middle" class="muted">4050</text><line x1="980" y1="131" x2="980" y2="377" stroke="#dbe3ed"/><text x="980" y="120" text-anchor="middle" class="muted">5400</text><text x="261" y="162" text-anchor="end" font-size="14">64 VU 재검증</text><rect x="275" y="145" width="3.394444444444445" height="19" rx="2" fill="#2563eb"><title>64 VU 재검증 / 응답 p95: 26 ms</title></rect><text x="285.39444444444445" y="162" font-size="12">26 ms</text><text x="261" y="210" text-anchor="end" font-size="14">256 VU 재검증</text><rect x="275" y="193" width="2.35" height="19" rx="2" fill="#2563eb"><title>256 VU 재검증 / 응답 p95: 18 ms</title></rect><text x="284.35" y="210" font-size="12">18 ms</text><text x="261" y="258" text-anchor="end" font-size="14">512 VU 최종 재검증</text><rect x="275" y="241" width="2.2194444444444446" height="19" rx="2" fill="#2563eb"><title>512 VU 최종 재검증 / 응답 p95: 17 ms</title></rect><text x="284.21944444444443" y="258" font-size="12">17 ms</text><text x="261" y="306" text-anchor="end" font-size="14">1,024 VU 짧은 탐색</text><rect x="275" y="289" width="130.55555555555554" height="19" rx="2" fill="#2563eb"><title>1,024 VU 짧은 탐색 / 응답 p95: 1000 ms</title></rect><text x="412.55555555555554" y="306" font-size="12">1000 ms</text><text x="261" y="354" text-anchor="end" font-size="14">2,048 VU 탐색</text><rect x="275" y="337" width="652.7777777777778" height="19" rx="2" fill="#2563eb"><title>2,048 VU 탐색 / 응답 p95: 5000 ms</title></rect><text x="934.7777777777778" y="354" font-size="12">5000 ms</text><text x="28" y="432" class="muted">64/256/512는 약 180초, 1,024/2,048 탐색은 약 45초. 측정 길이가 다르다.</text><text x="28" y="456" class="muted">출처: read-capacity.md · 2026-10-28~29 기록 / 2026-10-30 시각화 · 재측정 없음</text></svg>