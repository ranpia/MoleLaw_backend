name: Backend tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
      - name: Test and package without external API credentials
        run: bash ./gradlew test bootJar
      - name: Validate migrations on isolated MySQL
        run: bash ./gradlew mysqlIntegrationTest
      - name: Validate Refresh rotation on isolated Redis
        run: bash ./gradlew redisIntegrationTest
      - name: Preserve test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/test-results/
            build/reports/tests/
          retention-days: 7
