global
    log stdout format raw local0
    maxconn 8192

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 30m
    timeout server 30m

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 5s

# Fixed inbound routes only; no management listener or general-purpose forward proxy.
# init-addr none allows optional RAG targets to be absent in the minimal environment.
listen backend
    bind :8080
    server app backend:8080 resolvers docker init-addr none

listen mysql
    bind :3306
    server db mysql:3306 resolvers docker init-addr none

listen grafana
    bind :3000
    server dashboard grafana:3000 resolvers docker init-addr none

listen prometheus
    bind :9090
    server metrics prometheus:9090 resolvers docker init-addr none

listen qdrant-http
    bind :6333
    server vector qdrant:6333 resolvers docker init-addr none

listen qdrant-grpc
    bind :6334
    server vector qdrant:6334 resolvers docker init-addr none
