global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: molelaw-rag-prep
    file_sd_configs:
      - files: [/run/loadtest-secrets/rag-targets.json]
        refresh_interval: 5s
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: molelaw-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]
  - job_name: molelaw-mysql
    static_configs:
      - targets: [mysql-exporter:9104]
  - job_name: molelaw-redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: molelaw-containers
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: molelaw-loadtest
        action: keep
  - job_name: molelaw-redis-bench
    static_configs:
      - targets: [redis-bench-exporter:9121]
  - job_name: molelaw-refresh-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [refresh-backend:9091]
  - job_name: molelaw-qdrant
    metrics_path: /metrics
    http_headers:
      api-key:
        files: [/run/loadtest-secrets/qdrant-api-key]
    static_configs:
      - targets: [qdrant:6333]
  - job_name: molelaw-kure
    static_configs:
      - targets: [kure:9092]
