name: molelaw-local

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-molelawdb}
      MYSQL_USER: ${MYSQL_USER:-molelaw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env.compose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.compose}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-1G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    cpus: ${MYSQL_CPUS:-2.0}
    mem_limit: ${MYSQL_MEMORY_LIMIT:-2g}
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env.compose}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    cpus: ${QDRANT_CPUS:-4.0}
    mem_limit: ${QDRANT_MEMORY_LIMIT:-6g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.compose}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$REDIS_PASSWORD" in
          *[!a-zA-Z0-9_-]*|'') echo 'REDIS_PASSWORD must use letters, digits, underscore or hyphen.' >&2; exit 1 ;;
        esac
        umask 077
        printf 'bind 0.0.0.0\nprotected-mode yes\nrequirepass %s\nsave ""\nappendonly no\nmaxmemory 128mb\nmaxmemory-policy noeviction\n' "$$REDIS_PASSWORD" > /data/redis.conf
        chown redis:redis /data/redis.conf
        exec /usr/local/bin/docker-entrypoint.sh redis-server /data/redis.conf
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data:size=16m
    cpus: ${REDIS_CPUS:-1.0}
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
  qdrant_data:
  qdrant_snapshots:
