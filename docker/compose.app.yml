name: molelaw-app-local

services:
  backend:
    image: molelaw-app:local
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-molelawdb}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: qdrant
      QDRANT_GRPC_PORT: "6334"
      APP_LAW_VECTOR_QDRANT_BASE_URL: http://qdrant:6333
      APP_LAW_VECTOR_EMBEDDING_BASE_URL: http://kure:11434
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    networks:
      - infrastructure
      - embeddings
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /api/auth/csrf HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infrastructure:
    external: true
    name: molelaw-local_default
  embeddings:
    external: true
    name: molelaw-kure-service_default
