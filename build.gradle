plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.MoleLaw_backend'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:1.0.9'
	}
}


dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'me.paulschwarz:spring-dotenv:3.0.0'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Swagger ui
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// webclient
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.ai:spring-ai-qdrant-store'
	implementation 'io.grpc:grpc-api:1.65.1'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.testcontainers:mysql'

	// JWT (JJWT)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'


}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'openlaw-live', 'redis-live', 'mysql-integration', 'redis-integration', 'qdrant-integration', 'postman-simulation', 'embedding-live', 'evidence-decision-live', 'question-analysis-live', 'case-search-intent-live' }
}

tasks.register('caseSearchIntentLiveTest', Test) {
    description = 'Checks real LLM case intent and selection from public metadata; incurs API usage, no room data writes.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'case-search-intent-live' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('questionAnalysisLiveTest', Test) {
    description = 'Checks intent extraction with one real OpenAI call; incurs API usage, without retrieval or embedding.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'question-analysis-live' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('evidenceDecisionLiveTest', Test) {
    description = 'Checks four evidence decisions with the configured real OpenAI model; incurs API usage.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'evidence-decision-live' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('embeddingLiveTest', Test) {
    description = 'Runs both law vector tools against the real local KURE server and an isolated Qdrant.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'embedding-live' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}

tasks.register('lawEtlSimulationTest', Test) {
    description = 'Runs ETL against the local Postman embedding simulation and isolated Qdrant; requires LAW_VECTOR_SIMULATION_URL.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching 'com.MoleLaw_backend.law.service.tool.LawVectorPostmanSimulationTest' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
}

tasks.register('aiLawSearchSimulationTest', Test) {
    description = 'Checks aiSearch HTTP contract, failures, and cited consultation persistence without Qdrant.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postman-simulation' }
    filter {
        includeTestsMatching 'com.MoleLaw_backend.law.client.openlaw.AiLawSearchSimulationTest'
        includeTestsMatching 'com.MoleLaw_backend.common.config.AiSearchConsultationSimulationTest'
    }
    outputs.upToDateWhen { false }
}

tasks.register('initialConsultationSimulationTest', Test) {
    description = 'Checks question-to-first-answer HTTP flow, ETL and atomic persistence with Postman embeddings and isolated Qdrant.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postman-simulation' }
    filter { includeTestsMatching 'com.MoleLaw_backend.common.config.InitialConsultationSimulationTest' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
}

tasks.register('lawEffectiveDateSimulationTest', Test) {
    description = 'Verifies effective-date law detail requests over real HTTP against the local Postman fixture.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postman-simulation' }
    filter { includeTestsMatching 'com.MoleLaw_backend.law.service.search.LawEffectiveDateSimulationTest' }
    outputs.upToDateWhen { false }
}

tasks.register('followUpConsultationSimulationTest', Test) {
    description = 'Checks room-scoped precedent consent, tool callbacks, HTTP transport, persistence and evidence APIs.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postman-simulation' }
    filter { includeTestsMatching 'com.MoleLaw_backend.common.config.FollowUpConsultationSimulationTest' }
    outputs.upToDateWhen { false }
}

tasks.register('initialQuestionSuggestionSimulationTest', Test) {
    description = 'Checks recommendation ChatClient options and errors over HTTP against a synthetic model provider.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'postman-simulation' }
    filter { includeTestsMatching 'com.MoleLaw_backend.chat.service.answer.InitialQuestionSuggestionSimulationTest' }
    outputs.upToDateWhen { false }
}

tasks.register('qdrantIntegrationTest', Test) {
    description = 'Validates isolated Qdrant collection metadata, vector upserts and distinct-article top-15 retrieval.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'qdrant-integration' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
}

tasks.register('redisIntegrationTest', Test) {
    description = 'Validates Refresh Lua rotation, reuse, revocation and failure handling on isolated Redis.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'redis-integration' }
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
}

tasks.register('mysqlIntegrationTest', Test) {
    description = 'Migrates an isolated MySQL 8.4 container and validates all JPA mappings and data constraints.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'mysql-integration' }
    // Docker 29 rejects docker-java's older default API; keep this local to Docker tests.
    systemProperty 'api.version', providers.gradleProperty('dockerApiVersion').getOrElse('1.44')
    outputs.upToDateWhen { false }
}

tasks.register('openLawLiveTest', Test) {
    description = 'Calls the real OpenLaw API using OC_KEY or the local .env; no DB or model API required.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'openlaw-live' }
    outputs.upToDateWhen { false }
    testLogging { showStandardStreams = true }
}
